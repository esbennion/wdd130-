<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Water Rafting Adventures</title>
    <meta name="description"
        content="White Water Rafting Contact Us Page For Inquiry or if You Just Need to Send a Message">
    <meta name="author" content="Emily Bennion">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/raftinglogo.jpg"
            alt="image of a yellow raft full of people in saftey gear taken from an above perspective with the words TRAVEL RAFTING surrounding the image">
        <nav>
            <ul class="main-nav">
                <li class="navitem"><a href="index.html">Home</a></li>
                <li class="navitem"><a href="about.html">About Us</a></li>
                <li class="navitem"><a href="trips.html">Trips</a></li>
                <li class="navitem"><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="hero1">Send Us a Message</h1>
        <address class="company-address">
            123 Main River Street<br>
            Kolob, Washington<br>
            +1 123 456 7890<br>
            info@wateraftingadventues.com
        </address>
        <div class="contact-map-form">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15953.293825020475!2d-77.08649861883632!3d38.288457608470225!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1764775520005!5m2!1sen!2sus"
                width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                class="map"></iframe>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="useremail" id="userinfo">Email: </label>
                <input type="text" id="useremail" name="useremail" required>
                <fieldset>
                    <legend>Purpose of Message:</legend>
                    <label><input type="radio" id="purpose" name="purpose" value="general" required>General
                        Inquiry</label>
                    <label><input type="radio" id="purpose" name="purpose" value="reservation">Reservation
                        Question</label>
                    <label><input type="radio" id="purpose" name="purpose" value="suggestion">Website Suggestion</label>
                    <label for="message">Your Message: </label>
                    <textarea id="message" name="message" rows="5" cols="30" required></textarea>
                    <div class="newsletter1">
                        <label><input type="checkbox" id="subscribe" name="subscribe" name="newsletter">Please subscribe
                            me to the monthly newsletter!</label>
                    </div>
                </fieldset>

                <button type="submit" class="submit-button">Get in Touch</button>
            </form>
        </div>
        <div class="employees">
            <figure>
                <img src="images/employee1.webp"
                    alt="3 people in a raft going down rapids with one person in the back arms in the air both ands on an oar with a smile on their face">
                <figcaption>Meet Jeremy</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg"
                    alt="woman aboard a raft with a hat and sunglasses on smiling helping giving direction to other passengers">
                <figcaption>Meet Natasha</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.webp"
                    alt="a group of 5 people on a raft with one in the back with his hands in the air while the raft is going down a water fall">
                <figcaption>Meet Larry</figcaption>
            </figure>
        </div>

    </main>
    <footer>
        <p>&copy; 2025 💦Water Rafting Adventures💦 Emily Bennion</p>
        <nav class=" socialmedia">
            <a href="http://facebook.com">
                <img src="images/facebook.svg" alt="blue round facebook logo" width="30"></a>
            <a href="http://instagram.com">
                <img src="images/instagram.svg" alt="red, yellow, and pink instagram logo" width="30"></a>
            <a href="http://youtube.com">
                <img src="images/youtube.svg" alt="red circle image of youtube logo" width="30"></a>
        </nav>
    </footer>
</body>

</html>
