<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Rafting Adventures</title>
    <meta name="description" content="River Rafting website for planning out a trip">
    <meta name="author" content="Emily Bennion">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/raftinglogo.jpg"
            alt="image of a yellow raft full of people in saftey gear taken from an above perspective with the words TRAVEL RAFTING surrounding the image">
        <nav>
            <ul class="main-nav">
                <li class="navitem"><a href="index.html">Home</a></li>
                <li class="navitem"><a href="about.html">About Us</a></li>
                <li class="navitem"><a href="trips.html">Trips</a></li>
                <li class="navitem"><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <img src="images/team-rafting.webp" alt="large group of 11 people with gear and oars working as a team to control a red raft going through rapids on choppy
                water">
            <h1 class="call to action">Ready for a Thrilling Adventure!</h1>
            <p>Embark on a breathtaking adventure and make memories for a lifetime.</p>
            <ul class="book button">
                <li class="book"><a href="trips.html">
                        <button type="button" class="submit-button">BOOK A TRIP</button></a></li>
            </ul>
        </section>
        <form>
            <h2>Sign Up for our Newsletter!</h2>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="useremail" id="userinfo">Email: </label>
            <input type="text" id="useremail" name="useremail" required>
            <label><input type="checkbox" id="subscribe" name="subscribe">I want the monthly newsletter!</label>
            <button type="submit" class="submit-button">Subscribe</button>
        </form>

        <div class="adventures">
            <figure>
                <img src="images/getwetraft.jpg" alt="a group rafting through rapids completly covered by the waves">
                <figcaption>Group Rafting</figcaption>
            </figure>
            <figure>
                <img src="images/kayaking.jpg" alt="individual man on a red kayak going down rapids">
                <figcaption>Independent Kayaking Experience</figcaption>
            </figure>
            <figure>
                <img src="images/hiking.jpg"
                    alt="2 young girls with walking stick hiking down a paved walkway surrounded by forest">
                <figcaption>Hiking and Camping</figcaption>
            </figure>
            <figure>
                <img src="images/rapidlandscape.webp"
                    alt="beautiful blue water of a flowing river with a raft calmly floating down it">
                <figcaption>Relaxing Landscape Viewing</figcaption>
            </figure>
        </div>

    </main>
    <footer>
        <p>&copy; 2025 💦Water Rafting Adventures💦 Emily Bennion</p>
        <nav class=" socialmedia">
            <a href="http://facebook.com">
                <img src="images/facebook.svg" alt="blue round facebook logo" width="30"></a>
            <a href="http://instagram.com">
                <img src="images/instagram.svg" alt="red, yellow, and pink instagram logo" width="30"></a>
            <a href="http://youtube.com">
                <img src="images/youtube.svg" alt="red circle image of youtube logo" width="30"></a>
        </nav>
    </footer>
</body>

</html>
