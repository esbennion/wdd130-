<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Poll</title>
    <meta name="description" content="WDD 130 | HTML For - User Poll">
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <div>
        <header>WDD 130 | HTML Form - User Poll
        </header>
        <h1>Contact Information</h1>
        <form>
            <div class="form-item column2">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>
            <div class="form-item column2">
                <label for="username">Email:</label>
                <input type="email" id="useremail" name="useremail" required>
            </div>
        </form>
        <h2>Questions:</h2>
        <form>
            <div class="form-item column1">
                <label for="browser">What is your favorite internet brower?</label>
                <select id="browser" name="browser">
                    <option value="chrome">Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-item column1">
                <label for="pet">Do you have a pet in your house?</label>
                <input type="checkbox" id="pet" name="pet">
                <label for="feedback">List the places you have lived:</label>
                <textarea id="feedback" name="feedback" rows="4"
                    placeholder="Destin Florida, Salt Lake City Utah, Des Moines Iowa"></textarea>
            </div>
        </form>
        <button type="submit">Submit Poll</button>
        </main>
        <footer>
            <p>&copy;2025 Emily Bennion</p>
        </footer>
</body>

</html>
